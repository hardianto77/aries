services:
  api:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat-api
    ports:
      - "3080:3080"
    depends_on:
      - mongo
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongo:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-change-me}
      - APP_TITLE=Aries
      - ALLOW_REGISTRATION=true
      - JWT_SECRET=3713091c294c41e2ff09d332d990061c5e1a514aa26f2b2e5f4f96c3273685cb
      - JWT_REFRESH_SECRET=4053c7c8e977d0ea509c2712362b43945ee29a58e674daeca1ed86294c3736fa
      - CREDS_KEY=${CREDS_KEY:-change-me}
      - CREDS_IV=${CREDS_IV:-change-me}
    volumes:
      - /data/home/chat-agent/librechat.yaml:/app/librechat.yaml
      - ./images:/app/client/public/images
      - /data/home/ca-src/client/dist:/app/client/dist
      - ./dist-assets:/app/client/dist/assets
      - ./knowledge:/app/knowledge
  mongo:
    image: mongo:4.4.18
    container_name: librechat-mongo
    restart: unless-stopped
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: librechat-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-change-me}
      - APP_TITLE=Aries
      - JWT_SECRET=3713091c294c41e2ff09d332d990061c5e1a514aa26f2b2e5f4f96c3273685cb
      - JWT_REFRESH_SECRET=4053c7c8e977d0ea509c2712362b43945ee29a58e674daeca1ed86294c3736fa
      - CREDS_KEY=${CREDS_KEY:-change-me}
      - CREDS_IV=${CREDS_IV:-change-me}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data
